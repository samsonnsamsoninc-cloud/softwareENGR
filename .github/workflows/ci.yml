name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install -r requirements.txt

      - name: Build check
        run: python -m compileall app.py domain.py project_repository.py

      - name: Run tests with coverage
        run: python -m pytest -v --cov=app --cov=domain --cov=project_repository --cov-report=term-missing

